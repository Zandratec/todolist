<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoList - Kanban доска</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- ШАПКА -->
    <header class="app-header" role="banner">
      <button class="btn-icon sidebar-toggle" id="sidebarToggle" aria-label="Переключить боковую панель" data-tooltip="Боковая панель">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        <span>TodoList</span>
      </div>

      <!-- ГЛОБАЛЬНЫЙ ПОИСК -->
      <div class="header-search" role="search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="globalSearch" placeholder="Поиск по задачам... (Ctrl+F)" aria-label="Глобальный поиск" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="Очистить поиск">&times;</button>
        <div class="search-results-overlay" id="searchResults" role="listbox"></div>
      </div>

      <!-- ДЕЙСТВИЯ В ШАПКЕ -->
      <div class="header-actions">
        <span class="save-indicator" id="saveIndicator" role="status">Сохранено</span>
        <button class="btn-icon" id="themeToggle" data-tooltip="Переключить тему" aria-label="Переключить тему">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="btn btn-primary" id="newProjectBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Новый проект
        </button>
      </div>
    </header>

    <!-- ТЕЛО ПРИЛОЖЕНИЯ -->
    <div class="app-body">
      <!-- БОКОВАЯ ПАНЕЛЬ -->
      <aside class="app-sidebar" id="sidebar" role="navigation" aria-label="Проекты">
        <div class="sidebar-header">
          <span class="sidebar-title">Проекты</span>
          <button class="btn-icon" id="addProjectBtn" data-tooltip="Добавить проект" aria-label="Добавить проект">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="project-list" id="projectList" role="listbox"></div>
      </aside>

      <!-- ОСНОВНАЯ ОБЛАСТЬ -->
      <main class="app-main" id="mainContent" role="main">
        <!-- ПАНЕЛЬ ФИЛЬТРОВ -->
        <div class="kanban-toolbar" id="kanbanToolbar">
          <div class="filter-group">
            <select id="filterPriority" aria-label="Фильтр по приоритету">
              <option value="">Все приоритеты</option>
              <option value="high">Высокий</option>
              <option value="medium">Средний</option>
              <option value="low">Низкий</option>
            </select>
            <select id="filterAssignee" aria-label="Фильтр по исполнителю">
              <option value="">Все исполнители</option>
            </select>
            <select id="filterTag" aria-label="Фильтр по тегу">
              <option value="">Все теги</option>
            </select>
          </div>
          <div class="quick-filters">
            <button class="quick-filter-btn" data-filter="all">Все</button>
            <button class="quick-filter-btn" data-filter="mine">Мои задачи</button>
            <button class="quick-filter-btn" data-filter="overdue">Просроченные</button>
            <button class="quick-filter-btn" data-filter="today">Сегодня</button>
            <button class="quick-filter-btn" data-filter="week">На этой неделе</button>
          </div>
          <div style="margin-left:auto;display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" id="exportBtn" data-tooltip="Экспорт в JSON">Экспорт</button>
            <button class="btn btn-secondary btn-sm" id="importBtn" data-tooltip="Импорт из JSON">Импорт</button>
            <button class="btn btn-danger btn-sm" id="clearDataBtn" data-tooltip="Очистить все данные">Очистить</button>
          </div>
        </div>

        <!-- KANBAN ДОСКА -->
        <div class="kanban-board" id="kanbanBoard"></div>
      </main>
    </div>
  </div>

  <!-- КОНТЕЙНЕР ДЛЯ УВЕДОМЛЕНИЙ -->
  <div class="notification-container" id="notificationContainer" role="alert" aria-live="polite"></div>

  <!-- МОДАЛКА: ПРОЕКТ -->
  <div class="modal-overlay" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="projectModalTitle">Новый проект</h2>
        <button class="modal-close" data-modal-close aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="projectName">Название проекта</label>
          <input type="text" class="form-input" id="projectName" placeholder="Введите название" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label" for="projectDescription">Описание</label>
          <textarea class="form-textarea" id="projectDescription" placeholder="Описание проекта" maxlength="500"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Цвет проекта</label>
          <div class="color-picker" id="projectColorPicker"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Иконка</label>
          <div class="icon-picker" id="projectIconPicker"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal-close>Отмена</button>
        <button class="btn btn-primary" id="saveProjectBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ЗАДАЧА -->
  <div class="modal-overlay" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 class="modal-title" id="taskModalTitle">Новая задача</h2>
        <button class="modal-close" data-modal-close aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="taskTitle">Заголовок</label>
          <input type="text" class="form-input" id="taskTitle" placeholder="Введите заголовок задачи" required maxlength="200">
        </div>
        <div class="form-group">
          <label class="form-label" for="taskDescription">Описание</label>
          <textarea class="form-textarea" id="taskDescription" placeholder="Подробное описание задачи" maxlength="2000"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskPriority">Приоритет</label>
            <select class="form-select" id="taskPriority">
              <option value="low">Низкий</option>
              <option value="medium" selected>Средний</option>
              <option value="high">Высокий</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="taskDeadline">Дедлайн</label>
            <input type="datetime-local" class="form-input" id="taskDeadline">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="taskAssignee">Исполнитель</label>
          <input type="text" class="form-input" id="taskAssignee" placeholder="Имя исполнителя" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">Теги (через Enter)</label>
          <div style="display:flex;gap:8px;">
            <input type="text" class="form-input" id="taskTagInput" placeholder="Введите тег и нажмите Enter" style="flex:1;">
            <button class="btn btn-secondary btn-sm" id="addTagBtn">Добавить</button>
          </div>
          <div class="task-tags" id="taskTagsContainer" style="margin-top:8px;"></div>
        </div>

        <!-- ЦВЕТ ЗАДАЧИ -->
        <div class="form-group">
          <label class="form-label">Цвет задачи</label>
          <div class="color-picker" id="taskColorPicker"></div>
          <div class="form-hint">Оставьте пустым для цвета по умолчанию</div>
        </div>

        <!-- ПОДЗАДАЧИ -->
        <div class="form-group">
          <label class="form-label">Подзадачи</label>
          <div id="modalSubtaskList"></div>
        </div>

        <!-- КОММЕНТАРИИ -->
        <div class="form-group">
          <label class="form-label">Комментарии</label>
          <div class="comment-list" id="commentList"></div>
          <div class="comment-form">
            <textarea id="commentInput" placeholder="Напишите комментарий..." rows="2"></textarea>
            <button class="btn btn-primary btn-sm" id="addCommentBtn">Отправить</button>
          </div>
        </div>

        <!-- ВЛОЖЕНИЯ -->
        <div class="form-group">
          <label class="form-label">Вложения</label>
          <div class="attachment-list" id="attachmentList"></div>
          <div style="display:flex;gap:8px;">
            <input type="text" class="form-input" id="attachmentUrl" placeholder="URL ссылки" style="flex:1;">
            <button class="btn btn-secondary btn-sm" id="addAttachmentBtn">+ Ссылка</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal-close>Отмена</button>
        <button class="btn btn-warning" id="editTaskBtn" style="display:none;">Редактировать</button>
        <button class="btn btn-danger" id="deleteTaskBtn" style="display:none;">Удалить</button>
        <button class="btn btn-primary" id="saveTaskBtn">Сохранить</button>
        <button class="btn btn-primary" id="saveAndCloseBtn" style="display:none;">Сохранить и закрыть</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: КОЛОНКА (ДОБАВЛЕНИЕ/РЕДАКТИРОВАНИЕ) -->
  <div class="modal-overlay" id="columnModal" role="dialog" aria-modal="true" aria-labelledby="columnModalTitle">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h2 class="modal-title" id="columnModalTitle">Новая колонка</h2>
        <button class="modal-close" data-modal-close aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="columnName">Название</label>
          <input type="text" class="form-input" id="columnName" placeholder="Введите название колонки" required maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">Цвет колонки</label>
          <div class="color-picker" id="columnColorPicker"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal-close>Отмена</button>
        <button class="btn btn-primary" id="columnSaveBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ПОДТВЕРЖДЕНИЕ -->
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h2 class="modal-title" id="confirmModalTitle">Подтверждение</h2>
        <button class="modal-close" data-modal-close aria-label="Закрыть">&times;</button>
      </div>
      <div class="confirm-body">
        <div class="confirm-icon" id="confirmIcon">⚠</div>
        <div class="confirm-text" id="confirmText">Вы уверены?</div>
        <div class="confirm-hint" id="confirmHint">Это действие нельзя отменить.</div>
      </div>
      <div class="modal-footer" style="justify-content:center;">
        <button class="btn btn-secondary" data-modal-close>Отмена</button>
        <button class="btn btn-danger" id="confirmActionBtn">Подтвердить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ДОБАВЛЕНИЕ ПОДЗАДАЧИ -->
  <div class="modal-overlay" id="subtaskModal" role="dialog" aria-modal="true" aria-labelledby="subtaskModalTitle">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h2 class="modal-title" id="subtaskModalTitle">Добавить подзадачу</h2>
        <button class="modal-close" data-modal-close aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="subtaskExistingSelect">Выбрать существующую задачу</label>
          <select class="form-select" id="subtaskExistingSelect">
            <option value="">— Создать новую —</option>
          </select>
        </div>
        <div class="form-divider"><span>или</span></div>
        <div class="form-group">
          <label class="form-label" for="subtaskNewTitle">Название новой подзадачи</label>
          <input type="text" class="form-input" id="subtaskNewTitle" placeholder="Введите название" maxlength="200">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal-close>Отмена</button>
        <button class="btn btn-primary" id="subtaskAddBtn">Добавить</button>
      </div>
    </div>
  </div>

  <!-- СКРЫТЫЙ INPUT ДЛЯ ИМПОРТА -->
  <input type="file" id="importFileInput" accept=".json" style="display:none;">

  <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
  <script src="js/state.js"></script>
  <script src="js/projectManager.js"></script>
  <script src="js/taskManager.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
